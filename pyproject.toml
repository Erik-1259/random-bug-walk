[project]
name = "random-bug-walk"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-reportlog==1.0.0",
  "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pyright]
include = ["python"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["python"]
