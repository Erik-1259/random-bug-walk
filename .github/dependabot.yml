version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.71.0 declares the typescript peer range ">=4.8.4 <6.1.0" and does not
      # support releases outside it. TypeScript 7.0.2, the first release outside that peer range,
      # installs with a peer dependency warning, and pnpm lint fails because typescript-eslint
      # stops with "does not support TS 7.0". Raise this bound together with typescript-eslint.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Node 24 bundles undici 7, and @types/node types fetch's `dispatcher` with undici-types 7, so an
      # undici 8 Agent does not type-check as that dispatcher (screen and harvest-review live-fetch.ts).
      # Raise this together with the Node runtime major.
      - dependency-name: undici
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node 24 runtime pinned in container/Dockerfile and CI; newer majors
      # describe APIs Node 24 does not have. Raise this bound together with the runtime.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
      # Majors of any npm dependency are taken by hand after a review of their breaking changes, so
      # Dependabot proposes only minor and patch releases.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # uv_build is pinned to the same version as the uv tool (setup-uv in ci.yml and
      # ghcr.io/astral-sh/uv in container/Dockerfile). Bump all of them together by hand.
      - dependency-name: uv-build
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
