version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.71.0 declares the typescript peer range ">=4.8.4 <6.1.0" and does not
      # support releases outside it. TypeScript 7.0.2, the first release outside that peer range,
      # installs with a peer dependency warning, and pnpm lint fails because typescript-eslint
      # stops with "does not support TS 7.0". Raise this bound together with typescript-eslint.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      uv:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci(deps)
