# Appended to postgresql.conf of each fresh instance; later settings win. Everything else stays at
# PostgreSQL's defaults, as the app's contract requires (no lock-wait or statement logging).
listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/run/rbw-pg'
unix_socket_permissions = 0770
# The server time zone of profile M2 of the custom host harness at baseline 2.
timezone = 'Asia/Tokyo'
log_timezone = 'UTC'
jit = off
logging_collector = off
