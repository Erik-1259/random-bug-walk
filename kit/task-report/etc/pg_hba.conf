# Socket connections: only root and rbw-db can reach /run/rbw-pg (root:rbw-db 0770). The
# evaluator connects here as the superuser (monitor), the owner and the gate role.
local   all       all                          trust
# TCP: the app role from loopback only, with its password. Nothing else is accepted.
host    taskapp   taskapp_app   127.0.0.1/32   scram-sha-256
