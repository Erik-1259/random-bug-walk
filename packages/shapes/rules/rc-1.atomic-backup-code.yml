        inside:
          kind: object
          inside:
            kind: arguments
            inside:
              kind: call_expression
              has:
                field: function
                regex: ^prisma\.client\.twoFactorBackupCode\.updateMany$
    - inside:
        kind: function_declaration
        stopBy: end
        has:
          field: name
          regex: ^POST$
constraints:
  ID:
    kind: member_expression
    regex: ^unusedCodes\[matchIndex\]\.id$
