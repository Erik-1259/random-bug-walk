id: race.upsert
snapshots:
  ? |
    async function bump(profileId) {
      const stat = await db.stat.upsert({ create: { profileId, visits: 1 }, where: { profileId }, update: { visits: { increment: 1 } } });
      return stat;
    }
  : fixed: |
      async function bump(profileId) {
        const stat = await db.stat.findUnique({ where: { profileId } }).then((found) => (found ? db.stat.update({ where: { profileId }, data: { visits: { increment: 1 } } }) : db.stat.create({ data: { profileId, visits: 1 } })));
        return stat;
      }
