  - |
    export async function POST(request: Request) {
      if (body.backupCode) {
        const matchIndex = await verifySyntheticCode(body.backupCode, hashes);
        const consumed = await prisma.client.twoFactorBackupCode.updateMany({ where: { id: unusedCodes[matchIndex].id, used: false }, data: { used: true } });
        if (consumed.count === 0) {
          return badRequest();
        }
      }
      return json({});
