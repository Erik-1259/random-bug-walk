id: rc-1.atomic-backup-code.source
valid:
  - |
    export async function POST(request: Request) {
      const unusedCodes = await prisma.client.twoFactorBackupCode.findMany({
        where: { userId, used: false },
      });
      return unusedCodes;
    }
  - |
    export async function GET(request: Request) {
      await prisma.client.twoFactorBackupCode.update({
        where: { id: unusedCodes[matchIndex].id },
        data: { used: true },
      });
    }
  - |
    export async function POST(request: Request) {
      await prisma.client.syntheticCode.update({
        where: { id: unusedCodes[matchIndex].id },
        data: { used: true },
      });
    }
invalid:
  - |
    export async function POST(request: Request) {
      await prisma.client.twoFactorBackupCode.update({
        where: { id: unusedCodes[matchIndex].id },
        data: { used: true },
      });
    }
  - |
    export async function POST(request: Request) {
      const consumed = await prisma.client.twoFactorBackupCode.updateMany({
        where: { id: unusedCodes[matchIndex].id, used: false },
        data: { used: true },
      });
      return consumed;
    }
